<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <rect width="100%" height="100%" fill="#520c24"/>
  <defs>
    <linearGradient id="nrGold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fdf0cf" />
      <stop offset="35%" stop-color="#eccd80" />
      <stop offset="70%" stop-color="#cf9f4c" />
      <stop offset="100%" stop-color="#aa7c30" />
    </linearGradient>
  </defs>

  <!-- Centered Monogram at (300, 160) -->
  <g transform="translate(200, 30) scale(1.0)">
    <!-- N: Left vertical stem -->
    <path d="M 47 36 L 45 148" stroke="url(#nrGold)" stroke-width="4.2" stroke-linecap="round" />
    <!-- N: Diagonal and middle stem -->
    <path d="M 45 140 Q 64 85 86 28 C 88 23 92 23 94 28 L 94 186" fill="none" stroke="url(#nrGold)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- R: Flourish & Bowl -->
    <path d="M 72 135 C 77 118 85 104 94 100 C 108 92 142 86 150 116 C 158 145 133 169 107 170" fill="none" stroke="url(#nrGold)" stroke-width="4.2" stroke-linecap="round" />
    <!-- R: Right vertical stem -->
    <path d="M 107 125 L 107 228" stroke="url(#nrGold)" stroke-width="4.2" stroke-linecap="round" />
    <!-- R: Diagonal leg -->
    <path d="M 107 170 L 152 193" stroke="url(#nrGold)" stroke-width="4.2" stroke-linecap="round" />
  </g>

  <!-- Typography matching brand -->
  <text x="300" y="320" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="0.22em" fill="#fdf0cf">NINA ROSA</text>
  <text x="300" y="360" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="14" font-weight="500" letter-spacing="0.32em" fill="#e5c276">ADVOCACIA E CONSULTORIA JURÍDICA</text>
</svg>
